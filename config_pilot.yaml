run_id: mock_001
mock: true                 # true면 MockClient/MockJudge 사용, 네트워크 없음
questions_file: data/pilot_questions_DRAFT.csv
server: {base_url: "http://localhost:1234/v1", api_key: "lm-studio", timeout_s: 180, max_retries: 3}
generation: {temperature: 0.7, top_p: 0.9, max_tokens: 512, reasoning_effort: "none"}  # reasoning_effort="none"만 프로브에서 reasoning_content를 없앴다 (2026-09-08, qwen3.6-35b-a3b). thinking/enable_thinking/chat_template_kwargs//no_think는 서버가 받아들이되 효과 없음.
repeats: 3
seeds: [1, 2, 3]
conditions: [P0, P1, P2, P3, P2L, P4, P5]
models:
  - {key: qwen35, lms_id: "qwen3.6-35b-a3b", quant: Q4_K_S, engine: llama.cpp}  # unsloth/Qwen3.6-35B-A3B-GGUF Q4_K_S (LM Studio 표기 22.7GB). 양자화는 조건 간이 아니라 조건 내 통제변인이라 Q4_K_M에서 바꿔도 비교는 성립한다. 파일럿과 본실험은 반드시 같은 파일.
  - {key: gemma4, lms_id: "gemma-4-12b-it-qat", quant: Q4_0_QAT, engine: llama.cpp}  # google 공식 QAT Q4_0 (7.2GB)
  - {key: gptoss20, lms_id: "openai/gpt-oss-20b", quant: MXFP4, engine: llama.cpp}  # lmstudio-community (12.1GB)
# judge.votes = 1: temperature 0.0에서 같은 요청을 3번 반복하는 것은 독립 평가자
# 3명이 아니라 거의 같은 답 3개다. 그걸 "3회 다수결"이라 부르면 있지도 않은
# 신뢰도를 주장하게 된다. 판정 신뢰도는 인간 400건 재판정 κ로 잡는다.
# (투표 기계는 남겨뒀다 — temperature>0으로 부분표본 자기일관성을 볼 때 쓴다.)
# 🚨 judge는 아직 확정이 아니다. 파일럿에서 사람이 라벨링한 80~100건과 대조해 κ로 고른다.
# 현재 받아둔 것 중 피험 3종(Qwen/Gemma/gpt-oss)과 계열이 다른 후보:
#   - devstral-small-2-24b-instruct-2512      Mistral 계열, instruct. 단 **코딩 특화**라 한국어 QA 채점 적합성 미확인
#   - glm-4.7-flash-uncensored-...            GLM 계열이나 **uncensored 변형**이라 판정자로 부적절
# 둘 다 미덥지 않으면 깨끗한 instruct 모델을 하나 더 받아 후보에 넣을 것.
judge: {key: judge_model, lms_id: "devstral-small-2-24b-instruct-2512", temperature: 0.0, votes: 1}
# numeric_tolerance_pct는 **상대 백분율**이지 백분율 포인트가 아니다.
# 예: 78%에 1.5를 주면 ±1.17%p다. 문항별 tolerance_pct 컬럼도 같은 의미다.
analysis: {alpha: 0.05, numeric_tolerance_pct: 1.0}
